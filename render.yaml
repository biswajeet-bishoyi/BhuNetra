services:
  # ---------------------------------------------------------------------------
  # 1. BhuNetra AI Backend (FastAPI Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: bhunetra-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXTRACTION_CONFIDENCE_THRESHOLD
        value: 0.75
      - key: EXTRACTION_MAX_EDGE
        value: 1280
      - key: JWT_SECRET
        generateValue: true

  # ---------------------------------------------------------------------------
  # 2. BhuNetra AI Frontend (React + Vite Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: bhunetra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      # Single Page Application fallback for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
